[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratecard"
version = "0.1.0"
description = "Bengaluru Rate Card - hyperlocal diagnostic price transparency"
requires-python = ">=3.11"

# Phase 01 deliberately runs on stdlib + PyYAML alone, so the taxonomy can be
# validated on a bare machine with no venv. Heavier stages opt in below.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Stage 4, Phase 02. The matcher.
# rapidfuzz alone is a working matcher; the embedding rerank is optional and
# lives in its own extra so the pipeline installs without it.
# Install torch from the CPU index unless you actually have an NVIDIA card -
# the default wheel drags in ~3GB of CUDA libraries that will never be used:
#   pip install --index-url https://download.pytorch.org/whl/cpu \
#       --extra-index-url https://pypi.org/simple torch sentence-transformers
normalise = ["rapidfuzz>=3.6"]
# Training the learned acceptor. Inference does not need this - the fitted
# model is JSON scored with plain arithmetic.
learn = ["scikit-learn>=1.4", "numpy>=1.26"]
rerank = ["sentence-transformers>=3.0"]
# Stages 2-3, Phase 04. Fetch and parse.
pipeline = ["httpx>=0.27", "pdfplumber>=0.11", "selectolax>=0.3", "pypdf>=4.0"]
# Stage 5, Phase 05: `ratecard load` writes to Postgres. There is no Python
# server - the runtime is Supabase (PostGIS, RLS, Realtime) and the Next.js app
# in web/, so FastAPI, uvicorn and geoalchemy2 were dropped.
serve = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ratecard = "ratecard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ratecard.taxonomy" = ["data/*.yaml"]
"ratecard.registry" = ["data/*.yaml"]
"ratecard.load" = ["data/*.yaml"]
"ratecard.specialties" = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
