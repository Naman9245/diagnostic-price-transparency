# Medical specialties a patient can search by and a doctor is filed under.
#
# The same problem as the test taxonomy, one level up: "Paediatrician", "child
# specialist" and "PAEDIATRICS OPD" are one specialty, while "Paediatric
# Surgery" is another. Scope is the OPD a patient can walk into. Diagnostic
# departments (pathology, radiology) are the test side of the product, and
# emergency, anaesthesia and critical care are not searched for in advance.
# AYUSH systems are out of scope for now, as are narrow subspecialties
# (paediatric cardiology and the like), which get added when a real source
# lists them.
#
# Names come from the NMC's MD / MS / DM / MCh / MDS subjects and from how
# Indian hospitals name their departments, in Indian English spelling. Unlike
# the test aliases, these were NOT drawn from a corpus: no source in the
# registry lists departments yet. Check them against real department lists as
# soon as one is registered, and add what those write.
#
# Two kinds of surface form, and the difference is the whole design:
#
#   aliases         name THIS specialty and nothing else. An exact hit resolves.
#                   `ratecard validate` refuses any alias two specialties share.
#   related_terms   what a patient types that points here without naming it:
#                   a body part ("kidney"), a named condition ("cataract"), or an
#                   umbrella word ("oncologist" names three specialties). They
#                   only ever SUGGEST, may be shared, and may never equal an
#                   alias. Symptoms are deliberately left out: turning
#                   "chest pain" into a specialty is triage, not search.
#
# If a word could belong to two specialties, it is a related term, never an
# alias. "kidney specialist" is a nephrologist to some people and a urologist to
# others, so it suggests both and resolves to neither. That is the same rule the
# test matcher follows: abstain rather than guess.
#
# `distinct_from` marks pairs that are easy to confuse and are never the same:
# a cardiologist is not a cardiac surgeon. Tests check each pair stays apart.
#
# Spelling: names.normalise already folds paediatric, gynaecology and
# haematology to US spelling, but not paediatrics, paediatrician, orthopaedics,
# gynaecologist or haematologist, so both spellings of those are listed.
# Department words (department, dept, OPD, clinic, consultation, consultant,
# unit, services) are stripped before lookup and need no aliases of their own.

# --------------------------------------------------------------- medical ----

- id: general_medicine
  name: General Medicine
  practitioner: General Physician
  category: medical
  aliases: [general medicine, internal medicine, medicine, physician,
            MD medicine, internist]
  related_terms: [diabetes, hypertension, blood pressure, thyroid]
  notes: >
    "Department of Medicine" is how Indian hospitals name this, so bare
    "medicine" resolves here. "General practitioner" and "GP" deliberately do
    not: in India a GP is usually an MBBS doctor, not an MD in medicine.

- id: family_medicine
  name: Family Medicine
  practitioner: Family Physician
  category: medical
  aliases: [family medicine, family physician, family doctor]

