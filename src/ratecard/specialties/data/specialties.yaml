  category: medical
  distinct_from: [clinical_psychology]
  aliases: [psychiatry, psychiatrist, psychological medicine]
  related_terms: [mental health, depression, anxiety, addiction]
  notes: >
    A psychiatrist is a doctor and prescribes; a clinical psychologist is not
    and does not. Patients mix them up constantly, which is why "mental
    health" suggests both and resolves to neither.

