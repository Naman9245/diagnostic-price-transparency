- id: c_peptide
  name: C-Peptide
  category: clinical_chemistry
  kind: lab
  specimen: serum
  fasting_required: true
  loinc: "1986-9"
  aliases: [C peptide, c-peptide, serum c peptide, C peptide fasting]

- id: microalbumin_urine
  name: Urine Microalbumin
  category: clinical_chemistry
  kind: lab
  specimen: urine
  fasting_required: false
  loinc: "14957-5"
  aliases: [microalbumin, urine microalbumin, microalbuminuria,
            urinary microalbumin, micro albumin urine]
  notes: >
    Specimen is urine. Any match to serum albumin must be blocked on specimen
    regardless of how high the string similarity runs.
