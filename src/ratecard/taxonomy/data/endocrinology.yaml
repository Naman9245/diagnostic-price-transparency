# Endocrinology. The two thyroid panels below carry the same analyte count and
# different analytes, which is why the rule layer compares component sets and
# not just analyte_count.

- id: thyroid_profile
  name: Thyroid Profile
  category: endocrinology
  kind: lab
  specimen: serum
  fasting_required: false
  is_panel: true
  analytes: [t3_total, t4_total, tsh]
  components: [t3_total, t4_total, tsh]
  aliases: [thyroid profile, TFT, thyroid function test, T3 T4 TSH,
            thyroid profile total, thyroid function tests,
            total thyroid profile, thyroid profile (T3 T4 TSH)]

- id: thyroid_profile_free
  name: Free Thyroid Profile
  category: endocrinology
  kind: lab
  specimen: serum
  fasting_required: false
  is_panel: true
  analytes: [t3_free, t4_free, tsh]
  components: [t3_free, t4_free, tsh]
  aliases: [free thyroid profile, FT3 FT4 TSH, thyroid profile free,
            free T3 free T4 TSH, thyroid profile (free)]
  notes: >
    HARD NEGATIVE vs thyroid_profile. Same analyte count, different analytes,
    routinely priced higher. Token overlap with the total panel is near-total.

