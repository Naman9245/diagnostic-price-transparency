# Haematology. The CBC / RBC-count pair in here is the canonical hard negative
# for the Phase 03 evaluation set: lexically close, clinically distinct,
# differently priced.

- id: cbc
  name: Complete Blood Count
  category: haematology
  kind: lab
  specimen: whole_blood
  fasting_required: false
  loinc: "58410-2"
  is_panel: true
  analytes: [haemoglobin, rbc_count, wbc_count, platelet_count, haematocrit,
             mcv, mch, mchc, rdw, differential_count]
  components: [haemoglobin, rbc_count, wbc_count, platelet_count, haematocrit,
               differential_count]
  aliases: [CBC, complete blood count, complete blood count (CBC), haemogram,
            hemogram, complete haemogram, CBC (complete blood count),
            complete blood picture, CBP, full blood count, FBC,
            complete blood count with differential, blood count complete]
  notes: >
    Ten reported analytes. Do not match to rbc_count, wbc_count or any single
    component: those are separately orderable and separately priced.

- id: haemoglobin
  name: Haemoglobin
  category: haematology
  kind: lab
  specimen: whole_blood
  fasting_required: false
  loinc: "718-7"
  aliases: [Hb, HB, hemoglobin, haemoglobin estimation, Hb estimation,
            hemoglobin (Hb), blood haemoglobin, Hgb]

- id: rbc_count
  name: RBC Count
  category: haematology
  kind: lab
  specimen: whole_blood
  fasting_required: false
  loinc: "789-8"
  aliases: [RBC, RBC count, red blood cell count, red cell count,
            erythrocyte count, total RBC count, TRBC]
  notes: >
    HARD NEGATIVE vs cbc. A single analyte, not a panel. Sources abbreviate
    both as three letters starting with a C or an R and token overlap is high.

