# Imaging. The discriminators here are structural, not lexical: view count for
# radiography, contrast for cross-sectional studies, body region everywhere.
# LOINC is deliberately null across this file - radiology LOINC codes were not
# verified against loinc.org and a guessed code is worse than an absent one.

# --- radiography -----------------------------------------------------------

- id: xray_chest_pa
  name: X-Ray Chest PA View
  category: imaging
  kind: imaging
  modality: radiography
  body_region: chest
  views: 1
  aliases: [chest X ray, X ray chest PA, CXR, chest radiograph,
            X-ray chest PA view, xray chest, chest X ray PA view,
            X ray chest single view]
  notes: >
    HARD NEGATIVE vs xray_chest_pa_lateral. One extra projection, materially
    higher price, and the words "chest x ray" are common to both.

- id: xray_chest_pa_lateral
  name: X-Ray Chest PA and Lateral
  category: imaging
  kind: imaging
  modality: radiography
  body_region: chest
  views: 2
  aliases: [X ray chest PA and lateral, chest X ray two views,
            CXR PA and lateral, X ray chest both views,
            chest radiograph PA and lateral]

- id: xray_abdomen_erect
  name: X-Ray Abdomen Erect
