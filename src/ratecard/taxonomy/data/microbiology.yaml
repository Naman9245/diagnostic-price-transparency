# Microbiology. Culture pricing is driven by specimen type, so specimen is the
# whole discriminator in this file - the test name is nearly identical across
# all of them.

- id: urine_culture
  name: Urine Culture and Sensitivity
  category: microbiology
  kind: lab
  specimen: urine
  fasting_required: false
  loinc: "630-4"
  aliases: [urine culture, urine C/S, urine culture and sensitivity,
            urine culture sensitivity, C&S urine, urine for culture]

- id: blood_culture
  name: Blood Culture and Sensitivity
  category: microbiology
  kind: lab
  specimen: whole_blood
  fasting_required: false
  loinc: "600-7"
  aliases: [blood culture, blood C/S, blood culture and sensitivity,
            blood culture sensitivity, culture blood]
  notes: HARD NEGATIVE vs urine_culture. Blocks on specimen alone.

