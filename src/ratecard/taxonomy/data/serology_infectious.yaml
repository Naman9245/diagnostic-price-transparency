# Serology and infectious disease. Heavy on Indian-specific tests (Widal,
# Typhidot, dengue panels) that no public vocabulary covers, which is why the
# aliases here are hand-curated rather than seeded.

- id: crp
  name: C-Reactive Protein
  category: immunology
  kind: lab
  specimen: serum
  fasting_required: false
  loinc: "1988-5"
  distinct_from: [crp_hs]
  aliases: [CRP, C reactive protein, C-reactive protein, serum CRP,
            CRP quantitative]

- id: crp_hs
  name: High Sensitivity CRP
  category: immunology
  kind: lab
  specimen: serum
  fasting_required: false
  loinc: "30522-7"
  aliases: [hs-CRP, hsCRP, high sensitivity CRP, ultra sensitive CRP,
            high sensitive C reactive protein]
  notes: HARD NEGATIVE vs crp. Different assay, different indication, higher price.

