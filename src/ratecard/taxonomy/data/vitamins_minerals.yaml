# Vitamins. The two vitamin D assays here are the census's headline example of
# lexical similarity without clinical sameness: they differ by the token
# "dihydroxy" and were quoted Rs 2,890 and Rs 2,800 in the same document.

- id: vitamin_d_25_hydroxy
  name: Vitamin D 25-Hydroxy
  category: vitamins_minerals
  kind: lab
  specimen: serum
  fasting_required: false
  loinc: "62292-8"
  distinct_from: [vitamin_d_1_25_dihydroxy]
  aliases: [vitamin D, vitamin D 25 hydroxy, 25 hydroxy vitamin D,
            vitamin D total, 25-OH vitamin D, vit D, vitamin D3,
            25 hydroxycholecalciferol, vitamin D 25 OH]
  notes: >
    The routine test. Rs 2,890 in the Narayana OPD tier.
    HARD NEGATIVE vs vitamin_d_1_25_dihydroxy.

- id: vitamin_d_1_25_dihydroxy
  name: Vitamin D 1,25-Dihydroxy
  category: vitamins_minerals
  kind: lab
  specimen: serum
  fasting_required: false
  loinc: "1649-3"
  aliases: [vitamin D 1 25 dihydroxy, 1 25 dihydroxy vitamin D,
            1,25-OH2 vitamin D, calcitriol level,
            vitamin D 1 25 dihydroxy calcitriol]
  notes: >
    A specialist assay, not the routine one. Rs 2,800 - close enough in price
    that a mismatch would not look obviously wrong in a comparison table.
    That is exactly why it must be blocked at the taxonomy layer.

